name: recon

# Dia 1 do sprint: RE de reconhecimento nos binarios do jogador.
# REPO PUBLICO temporario: binarios entram por token (release privada) e o
# relatorio de saida volta pro repo PRIVADO. Nada de artefato publico — logs
# de repo publico sao publicos e podem conter enderecos.

on:
  workflow_dispatch:
    inputs:
      pe_url:
        description: 'URL da release privada (vazio = pe-v1 do SuperBonn-assets)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  recon:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ secrets.ASSETS_PAT }}
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain (pcrecomp)
        run: bash scripts/lift/build-toolchain.sh tools/
        shell: bash

      - name: Baixar binarios (release privada, via token)
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.pe_url }}" ]; then
            curl -fL --retry 3 -H "Authorization: token $GH_TOKEN" -o pe.tar "${{ inputs.pe_url }}"
          else
            gh release download pe-v1 --repo Kapro777/SuperBonn-assets \
                --pattern megabonk-pe.tar.gz --output pe.tar --clobber
          fi
          mkdir -p lift/work/pe
          tar -xf pe.tar -C lift/work/pe
          ls lift/work/pe
        shell: bash

      - name: pe_analyze + catalog
        run: |
          set -euo pipefail
          mkdir -p lift/work/recon
          for f in lift/work/pe/*.exe lift/work/pe/*.dll; do
            [ -e "$f" ] || continue
            python3 tools/pcrecomp/tools/pe/pe_analyze.py "$f" --json "lift/work/recon/$(basename "$f").json" || true
          done
          python3 tools/pcrecomp/tools/pe/catalog.py lift/work/pe --json > lift/work/recon/catalog.json || true
        shell: bash

      - name: Censo de imports (a lista de shims)
        run: |
          set -euo pipefail
          python3 scripts/lift/import-census.py lift/work/pe lift/work/recon/imports-all.txt
          head -40 lift/work/recon/imports-all.txt
        shell: bash

      - name: Publicar relatorio no repo PRIVADO
        run: |
          set -euo pipefail
          TAG="recon-${{ github.run_id }}"
          tar -czf recon.tar.gz -C lift/work recon
          gh release create "$TAG" recon.tar.gz \
            --repo Kapro777/SuperBonn-assets \
            --title "Recon (run ${{ github.run_id }})" \
            --notes "Relatorio de RE do pipeline. Derivado dos binarios: fica privado." | tail -1
          rm -rf lift/work/recon recon.tar.gz
        shell: bash
