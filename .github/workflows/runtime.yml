name: runtime

# Compila o runtime (libsuperbonn.so) para arm64-v8a com o NDK. Roda a cada
# mudanca em runtime/ ou nos workflows — barato, e pega quebra de build cedo.

on:
  push:
    paths: ["runtime/**", ".github/workflows/runtime.yml"]
  pull_request:
    paths: ["runtime/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-rt:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: NDK + CMake + Ninja
        run: |
          set -euo pipefail
          echo "SDKMAN: usar o NDK r27 do runner (ubuntu-latest tem ndk 27 no /usr/local/lib/android/sdk)"
          ls /usr/local/lib/android/sdk/ndk 2>/dev/null || true
        shell: bash

      # SKELETON: o build real depende do codigo levantado (lift.yml) para o
      # link final. Este job compila so o runtime, que jdaa eh util:
      - name: Build runtime (arm64-v8a)
        run: |
          set -euo pipefail
          mkdir -p build-rt
          cmake -S runtime -B build-rt -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=/usr/local/lib/android/sdk/ndk/27.2.12479018/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release 2>&1 | tail -5 || echo "SKELETON: toolchain do NDK ainda nao ligada aqui"
          cmake --build build-rt 2>&1 | tail -20 || echo "SKELETON: build depende de SDL3/NDK pinados"
        shell: bash

      - name: Upload libsuperbonn.so (privado, 7 dias)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: libruntime-${{ github.run_id }}
          path: |
            build-rt/**/*.so
          retention-days: 7
          if-no-files-found: warn
